<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha — GVQ Ordens de Compra</title>
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="auth">
        <div class="auth-card">
            <img class="auth-logo" src="../assets/img/logo-gvq.png" alt="GVQ — Grupo Vilela de Queiroz">
            <h1 class="auth-titulo">Defina sua nova senha</h1>
            <p class="auth-subtitulo">No primeiro acesso, troque a senha temporária que o analista passou.</p>
            <form id="form-trocar-senha" class="auth-form">
                <div class="form-group">
                    <label for="senha-atual">Senha temporária</label>
                    <input id="senha-atual" type="password" required maxlength="128" autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="nova-senha">Nova senha (mínimo 8 caracteres)</label>
                    <input id="nova-senha" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmar-senha">Confirme a nova senha</label>
                    <input id="confirmar-senha" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
                </div>
                <p id="erro-senha" class="erro-form" role="alert"></p>
                <button id="btn-trocar-senha" class="btn btn-primario btn-lg btn-bloco" type="submit">Salvar nova senha</button>
                <button id="sair-troca" class="btn btn-fantasma btn-bloco" type="button">Sair</button>
            </form>
        </div>
    </main>
    <script type="module" src="../js/trocar-senha.js"></script>
</body>
</html>
