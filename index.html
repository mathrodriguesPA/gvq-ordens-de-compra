<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVQ - Ordens de Compra</title>
    <meta name="description" content="Solicitação e emissão de Ordens de Compra e transferência de gado do Grupo Vilela de Queiroz.">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="auth">
        <div class="auth-card">
            <img class="auth-logo" src="assets/img/logo-gvq.png" alt="GVQ — Grupo Vilela de Queiroz">
            <h1 class="auth-titulo">Ordens de Compra</h1>
            <p class="auth-subtitulo">Entre com seu usuário e senha.</p>

            <form id="form-login" class="auth-form">
                <div class="form-group">
                    <label for="login_usuario">Usuário</label>
                    <div class="campo-icone">
                        <svg class="icon"><use href="assets/img/icones.svg#usuario"></use></svg>
                        <input type="text" id="login_usuario" required autocomplete="username" placeholder="nome.sobrenome" autocapitalize="none" spellcheck="false">
                    </div>
                </div>
                <div class="form-group">
                    <label for="login_senha">Senha</label>
                    <div class="campo-icone">
                        <svg class="icon"><use href="assets/img/icones.svg#cadeado"></use></svg>
                        <input type="password" id="login_senha" required autocomplete="current-password">
                    </div>
                </div>
                <p id="erro-login" class="erro-form" role="alert"></p>
                <button type="submit" id="btn-entrar" class="btn btn-primario btn-lg btn-bloco">Entrar</button>
            </form>
            <p class="auth-rodape">Esqueceu a senha? Peça ao analista para redefinir.</p>
        </div>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
